<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nueve2siete | Recordatorios, merch y piezas a medida</title>
    <meta name="description" content="Recordatorios para fiestas, merchandising para empresas y piezas personalizadas a medida, hechas en Colombia." />
    <script>
      // Apply the saved or system theme before the first paint so dark-mode visitors never see a cream flash.
      // Mirrors the initial choice in src/context/ThemeContext.tsx.
      try {
        var saved = localStorage.getItem('n2s_theme')
        if (saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
